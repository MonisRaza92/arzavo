name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Deploy to EC2
      run: |
        cd /var/www/arzavo
        git pull origin main
        composer install --no-dev --optimize-autoloader
        npm install
        npm run build
        php artisan migrate --force
        php artisan config:clear
        php artisan cache:clear

